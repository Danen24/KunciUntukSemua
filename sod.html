<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard SOD - KUS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-body">

    <aside class="sidebar role-sod-sidebar">
        <div class="sidebar-brand"><span>🛡️</span> KUS Staf SOD</div>
        <div class="sidebar-user">
            <div class="user-avatar">🧑‍✈️</div>
            <div class="user-detail">
                <p id="user-logged-in-sod">Memuat...</p>
                <span>Staf Lapangan</span>
            </div>
        </div>
        <div class="sidebar-menu">
            <a href="#" class="menu-item active">⚡ Tugas Lapangan</a>
        </div>
        <button onclick="prosesLogout()" class="btn-logout-sidebar">Keluar Sistem ➔</button>
    </aside>

    <main class="main-content">
        <div class="dashboard-header-title">
            <h2>Manajemen Tugas Fisik Lapangan</h2>
            <p>Eksekusi permintaan penyerahan kunci berdasarkan urutan prioritas santri.</p>
        </div>

        <div class="content-box-dashboard animate-fade-up">
            <div class="table-responsive">
                <table class="modern-table">
                    <thead>
                        <tr>
                            <th>Nama Kunci / Ruang</th>
                            <th>Status Antrean</th>
                            <th>Santri Pemohon</th>
                            <th>Aksi Eksekusi Lapangan</th>
                        </tr>
                    </thead>
                    <tbody id="sod-table-body"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
